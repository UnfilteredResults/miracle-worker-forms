<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Contact Form - The Miracle Worker</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.6.0/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-purple-500 to-indigo-600 min-h-screen py-8 px-4">
    <div class="max-w-4xl mx-auto">
        <div class="card bg-base-100 shadow-2xl">
            <div class="card-body">
                <!-- Header -->
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-bold text-primary mb-2">THE CLEMSON LITTLE THEATRE</h1>
                    <h2 class="text-2xl font-semibold">Emergency Contact Form</h2>
                    <div class="divider"></div>
                </div>

                <form id="emergencyForm" action="https://api.web3forms.com/submit" method="POST">
                    <!-- Web3Forms Configuration -->
                    <input type="hidden" name="access_key" value="01c86d57-173b-4ad6-a227-421b6538aed6">
                    <input type="hidden" name="subject" value="Emergency Contact Form - Miracle Worker">
                    <input type="hidden" name="redirect" value="https://miracle-worker-forms.pages.dev/thank-you.html">
                    <input type="hidden" name="from_name" value="Miracle Worker Forms">

                    <!-- Show Name -->
                    <div class="form-control mb-4">
                        <label class="label">
                            <span class="label-text font-semibold">NAME OF SHOW <span class="text-error">*</span></span>
                        </label>
                        <input type="text" id="showName" name="Name of Show" value="The Miracle Worker" class="input input-bordered" required>
                    </div>

                    <!-- Name Row -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <div class="form-control">
                            <label class="label">
                                <span class="label-text font-semibold">LAST NAME <span class="text-error">*</span></span>
                            </label>
                            <input type="text" id="lastName" name="Last Name" class="input input-bordered" required>
                        </div>

                        <div class="form-control">
                            <label class="label">
                                <span class="label-text font-semibold">FIRST NAME <span class="text-error">*</span></span>
                            </label>
                            <input type="text" id="firstName" name="First Name" class="input input-bordered" required>
                        </div>
                    </div>

                    <!-- Role -->
                    <div class="form-control mb-4">
                        <label class="label">
                            <span class="label-text font-semibold">ROLE IN PRODUCTION <span class="text-error">*</span></span>
                        </label>
                        <input type="text" id="role" name="Role" class="input input-bordered" placeholder="e.g., Stage Manager, Actor, etc." required>
                    </div>

                    <!-- Email -->
                    <div class="form-control mb-4">
                        <label class="label">
                            <span class="label-text font-semibold">EMAIL ADDRESS <span class="text-error">*</span></span>
                        </label>
                        <input type="email" id="email" name="Email" class="input input-bordered" required>
                    </div>

                    <!-- Emergency Contact 1 -->
                    <div class="divider mt-8">EMERGENCY CONTACT 1</div>

                    <div class="form-control mb-4">
                        <label class="label">
                            <span class="label-text font-semibold">NAME <span class="text-error">*</span></span>
                        </label>
                        <input type="text" id="emergency1Name" name="Emergency Contact 1 Name" class="input input-bordered" required>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <div class="form-control">
                            <label class="label">
                                <span class="label-text font-semibold">CELL PHONE <span class="text-error">*</span></span>
                            </label>
                            <input type="tel" id="emergency1Phone" name="Emergency Contact 1 Phone" class="input input-bordered" required>
                        </div>

                        <div class="form-control">
                            <label class="label">
                                <span class="label-text font-semibold">RELATIONSHIP <span class="text-error">*</span></span>
                            </label>
                            <input type="text" id="relationship1" name="Emergency Contact 1 Relationship" class="input input-bordered" placeholder="e.g., Parent, Spouse, Friend" required>
                        </div>
                    </div>

                    <!-- Emergency Contact 2 -->
                    <div class="divider mt-8">EMERGENCY CONTACT 2</div>

                    <div class="form-control mb-4">
                        <label class="label">
                            <span class="label-text font-semibold">NAME <span class="text-error">*</span></span>
                        </label>
                        <input type="text" id="emergency2Name" name="Emergency Contact 2 Name" class="input input-bordered" required>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <div class="form-control">
                            <label class="label">
                                <span class="label-text font-semibold">CELL PHONE <span class="text-error">*</span></span>
                            </label>
                            <input type="tel" id="emergency2Phone" name="Emergency Contact 2 Phone" class="input input-bordered" required>
                        </div>

                        <div class="form-control">
                            <label class="label">
                                <span class="label-text font-semibold">RELATIONSHIP <span class="text-error">*</span></span>
                            </label>
                            <input type="text" id="relationship2" name="Emergency Contact 2 Relationship" class="input input-bordered" placeholder="e.g., Parent, Spouse, Friend" required>
                        </div>
                    </div>

                    <!-- If Under 18 -->
                    <div class="divider mt-8">IF CAST / CREW MEMBER IS UNDER 18</div>
                    <div class="alert alert-warning mb-4">
                        <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                        <span>Only complete this section if the participant is under 18 years old</span>
                    </div>

                    <div class="form-control mb-4">
                        <label class="label">
                            <span class="label-text font-semibold">PARENTS/GUARDIAN NAME</span>
                        </label>
                        <input type="text" id="parentName" name="Parent/Guardian Name" class="input input-bordered">
                    </div>

                    <div class="form-control mb-4">
                        <label class="label">
                            <span class="label-text font-semibold">CELL PHONE</span>
                        </label>
                        <input type="tel" id="parentPhone" name="Parent/Guardian Phone" class="input input-bordered">
                    </div>

                    <!-- Medical Information -->
                    <div class="divider mt-8">MEDICAL INFORMATION</div>

                    <div class="form-control mb-4">
                        <label class="label">
                            <span class="label-text font-semibold">KNOWN ALLERGIES</span>
                        </label>
                        <textarea id="allergies" name="Known Allergies" class="textarea textarea-bordered h-24" placeholder="List any known allergies"></textarea>
                    </div>

                    <div class="form-control mb-6">
                        <label class="label">
                            <span class="label-text font-semibold">MEDICAL CONDITIONS</span>
                        </label>
                        <textarea id="medicalConditions" name="Medical Conditions" class="textarea textarea-bordered h-24" placeholder="List any relevant medical conditions"></textarea>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary btn-lg w-full">Submit Emergency Contact Form</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
