<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Contact Form - The Miracle Worker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 50px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #000;
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .header h2 {
            color: #000;
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #000;
            font-weight: bold;
            font-size: 0.95em;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: none;
            border-bottom: 2px solid #000;
            font-size: 1em;
            background: transparent;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-bottom: 2px solid #667eea;
        }

        .form-group textarea {
            min-height: 60px;
            resize: vertical;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-row-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .section-title {
            margin-top: 30px;
            margin-bottom: 20px;
            color: #000;
            font-size: 1.1em;
            font-weight: bold;
            border-bottom: 2px solid #000;
            padding-bottom: 10px;
        }

        .btn-submit {
            background: #667eea;
            color: white;
            width: 100%;
            margin-top: 30px;
            font-size: 1.1em;
            font-weight: 600;
            padding: 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-submit:hover {
            background: #5568d3;
        }

        .required {
            color: #ff6b6b;
        }

        @media (max-width: 768px) {
            .form-row,
            .form-row-3 {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>THE CLEMSON LITTLE THEATRE</h1>
            <h2>EMERGENCY CONTACT FORM</h2>
        </div>

        <form id="emergencyForm" action="https://api.web3forms.com/submit" method="POST">
            <!-- Web3Forms Configuration -->
            <input type="hidden" name="access_key" value="01c86d57-173b-4ad6-a227-421b6538aed6">
            <input type="hidden" name="subject" value="Emergency Contact Form - Miracle Worker">
            <input type="hidden" name="redirect" value="https://miracle-worker-forms.pages.dev/thank-you.html">
            <input type="hidden" name="from_name" value="Miracle Worker Forms">

            <div class="form-group">
                <label for="showName">NAME OF SHOW <span class="required">*</span></label>
                <input type="text" id="showName" name="Name of Show" value="The Miracle Worker" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="lastName">LAST NAME <span class="required">*</span></label>
                    <input type="text" id="lastName" name="Last Name" required>
                </div>

                <div class="form-group">
                    <label for="firstName">FIRST NAME <span class="required">*</span></label>
                    <input type="text" id="firstName" name="First Name" required>
                </div>
            </div>

            <div class="form-group">
                <label for="role">ROLE IN PRODUCTION <span class="required">*</span></label>
                <input type="text" id="role" name="Role" required placeholder="e.g., Stage Manager, Actor, etc.">
            </div>

            <div class="form-group">
                <label for="email">EMAIL ADDRESS <span class="required">*</span></label>
                <input type="email" id="email" name="Email" required>
            </div>

            <h3 class="section-title">EMERGENCY CONTACT 1</h3>

            <div class="form-group">
                <label for="emergency1Name">NAME <span class="required">*</span></label>
                <input type="text" id="emergency1Name" name="Emergency Contact 1 Name" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="emergency1Phone">CELL PHONE <span class="required">*</span></label>
                    <input type="tel" id="emergency1Phone" name="Emergency Contact 1 Phone" required>
                </div>

                <div class="form-group">
                    <label for="relationship1">RELATIONSHIP <span class="required">*</span></label>
                    <input type="text" id="relationship1" name="Emergency Contact 1 Relationship" required placeholder="e.g., Parent, Spouse, Friend">
                </div>
            </div>

            <h3 class="section-title">EMERGENCY CONTACT 2</h3>

            <div class="form-group">
                <label for="emergency2Name">NAME <span class="required">*</span></label>
                <input type="text" id="emergency2Name" name="Emergency Contact 2 Name" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="emergency2Phone">CELL PHONE <span class="required">*</span></label>
                    <input type="tel" id="emergency2Phone" name="Emergency Contact 2 Phone" required>
                </div>

                <div class="form-group">
                    <label for="relationship2">RELATIONSHIP <span class="required">*</span></label>
                    <input type="text" id="relationship2" name="Emergency Contact 2 Relationship" required placeholder="e.g., Parent, Spouse, Friend">
                </div>
            </div>

            <h3 class="section-title">IF CAST / CREW MEMBER IS UNDER 18</h3>

            <div class="form-group">
                <label for="parentName">PARENTS/GUARDIAN NAME</label>
                <input type="text" id="parentName" name="Parent/Guardian Name">
            </div>

            <div class="form-group">
                <label for="parentPhone">CELL PHONE</label>
                <input type="tel" id="parentPhone" name="Parent/Guardian Phone">
            </div>

            <h3 class="section-title">MEDICAL INFORMATION</h3>

            <div class="form-group">
                <label for="allergies">KNOWN ALLERGIES</label>
                <textarea id="allergies" name="Known Allergies" placeholder="List any known allergies"></textarea>
            </div>

            <div class="form-group">
                <label for="medicalConditions">MEDICAL CONDITIONS</label>
                <textarea id="medicalConditions" name="Medical Conditions" placeholder="List any relevant medical conditions"></textarea>
            </div>

            <button type="submit" class="btn-submit">Submit Emergency Contact Form</button>
        </form>
    </div>
</body>
</html>
