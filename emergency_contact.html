<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Contact Form - The Miracle Worker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 20px;
        }

        .header h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .header h2 {
            color: #667eea;
            font-size: 1.5em;
            margin-bottom: 5px;
        }

        .header p {
            color: #666;
            font-size: 0.9em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .signature-section {
            margin-top: 30px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 5px;
        }

        .signature-section h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .signature-pad {
            border: 2px solid #ddd;
            border-radius: 5px;
            background: white;
            cursor: crosshair;
            touch-action: none;
        }

        .signature-buttons {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-clear {
            background: #ff6b6b;
            color: white;
        }

        .btn-clear:hover {
            background: #ee5555;
        }

        .btn-submit {
            background: #667eea;
            color: white;
            width: 100%;
            margin-top: 20px;
            font-size: 1.1em;
            font-weight: 600;
        }

        .btn-submit:hover {
            background: #5568d3;
        }

        .required {
            color: #ff6b6b;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Clemson Little Theatre</h1>
            <h2>The Miracle Worker</h2>
            <p>Emergency Contact Information Form</p>
        </div>

        <form id="emergencyForm" action="https://formsubmit.co/mike.shipley@clemsonlittletheatre.com" method="POST">
            <!-- FormSubmit Configuration -->
            <input type="hidden" name="_subject" value="Emergency Contact Form - Miracle Worker">
            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="_captcha" value="false">

            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">First Name <span class="required">*</span></label>
                    <input type="text" id="firstName" name="First Name" required>
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name <span class="required">*</span></label>
                    <input type="text" id="lastName" name="Last Name" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="role">Role in Production <span class="required">*</span></label>
                    <input type="text" id="role" name="Role" required placeholder="e.g., Stage Manager, Actor, etc.">
                </div>

                <div class="form-group">
                    <label for="dateOfBirth">Date of Birth <span class="required">*</span></label>
                    <input type="date" id="dateOfBirth" name="Date of Birth" required>
                </div>
            </div>

            <div class="form-group">
                <label for="address">Address <span class="required">*</span></label>
                <input type="text" id="address" name="Address" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="city">City <span class="required">*</span></label>
                    <input type="text" id="city" name="City" required>
                </div>

                <div class="form-group">
                    <label for="state">State <span class="required">*</span></label>
                    <input type="text" id="state" name="State" value="SC" required>
                </div>

                <div class="form-group">
                    <label for="zip">ZIP Code <span class="required">*</span></label>
                    <input type="text" id="zip" name="ZIP Code" required pattern="[0-9]{5}">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="phone">Phone Number <span class="required">*</span></label>
                    <input type="tel" id="phone" name="Phone Number" required pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" placeholder="###-###-####">
                </div>

                <div class="form-group">
                    <label for="email">Email Address <span class="required">*</span></label>
                    <input type="email" id="email" name="Email" required>
                </div>
            </div>

            <h3 style="margin-top: 30px; margin-bottom: 20px; color: #667eea;">Emergency Contact Information</h3>

            <div class="form-row">
                <div class="form-group">
                    <label for="emergencyName">Emergency Contact Name <span class="required">*</span></label>
                    <input type="text" id="emergencyName" name="Emergency Contact Name" required>
                </div>

                <div class="form-group">
                    <label for="relationship">Relationship <span class="required">*</span></label>
                    <input type="text" id="relationship" name="Relationship" required placeholder="e.g., Parent, Spouse, Friend">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="emergencyPhone">Emergency Contact Phone <span class="required">*</span></label>
                    <input type="tel" id="emergencyPhone" name="Emergency Contact Phone" required pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" placeholder="###-###-####">
                </div>

                <div class="form-group">
                    <label for="emergencyEmail">Emergency Contact Email</label>
                    <input type="email" id="emergencyEmail" name="Emergency Contact Email">
                </div>
            </div>

            <h3 style="margin-top: 30px; margin-bottom: 20px; color: #667eea;">Medical Information</h3>

            <div class="form-group">
                <label for="allergies">Known Allergies</label>
                <textarea id="allergies" name="Known Allergies" placeholder="List any known allergies (medications, foods, environmental)"></textarea>
            </div>

            <div class="form-group">
                <label for="medications">Current Medications</label>
                <textarea id="medications" name="Current Medications" placeholder="List any medications currently taking"></textarea>
            </div>

            <div class="form-group">
                <label for="medicalConditions">Medical Conditions</label>
                <textarea id="medicalConditions" name="Medical Conditions" placeholder="List any relevant medical conditions"></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="insurance">Health Insurance Provider</label>
                    <input type="text" id="insurance" name="Insurance Provider">
                </div>

                <div class="form-group">
                    <label for="policyNumber">Policy Number</label>
                    <input type="text" id="policyNumber" name="Policy Number">
                </div>
            </div>

            <div class="form-group">
                <label for="physician">Primary Physician Name and Phone</label>
                <input type="text" id="physician" name="Primary Physician" placeholder="Dr. Name - ###-###-####">
            </div>

            <div class="signature-section">
                <h3>Signature <span class="required">*</span></h3>
                <p style="margin-bottom: 15px; color: #666; font-size: 0.9em;">Please sign in the box below</p>
                <canvas id="signaturePad" class="signature-pad" width="720" height="200"></canvas>
                <div class="signature-buttons">
                    <button type="button" class="btn btn-clear" onclick="clearSignature()">Clear Signature</button>
                </div>
                <input type="hidden" id="signatureData" name="Signature" required>
            </div>

            <div class="form-group">
                <label for="signatureDate">Date <span class="required">*</span></label>
                <input type="date" id="signatureDate" name="Signature Date" required>
            </div>

            <button type="submit" class="btn btn-submit">Submit Emergency Contact Form</button>
        </form>
    </div>

    <script>
        // Signature pad functionality
        const canvas = document.getElementById('signaturePad');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;

        // Set canvas style
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        function getCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            if (e.touches) {
                return {
                    x: (e.touches[0].clientX - rect.left) * scaleX,
                    y: (e.touches[0].clientY - rect.top) * scaleY
                };
            }
            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }

        function startDrawing(e) {
            isDrawing = true;
            const coords = getCoordinates(e);
            [lastX, lastY] = [coords.x, coords.y];
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();

            const coords = getCoordinates(e);
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(coords.x, coords.y);
            ctx.stroke();
            [lastX, lastY] = [coords.x, coords.y];
        }

        function stopDrawing() {
            isDrawing = false;
        }

        // Mouse events
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        // Touch events
        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', stopDrawing);

        function clearSignature() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById('signatureData').value = '';
        }

        // Form submission
        document.getElementById('emergencyForm').addEventListener('submit', function(e) {
            // Save signature as base64
            const signatureData = canvas.toDataURL();

            // Check if signature is empty
            const blankCanvas = document.createElement('canvas');
            blankCanvas.width = canvas.width;
            blankCanvas.height = canvas.height;

            if (signatureData === blankCanvas.toDataURL()) {
                e.preventDefault();
                alert('Please provide your signature before submitting.');
                return false;
            }

            document.getElementById('signatureData').value = signatureData;
        });

        // Auto-fill today's date
        document.getElementById('signatureDate').valueAsDate = new Date();
    </script>
</body>
</html>
